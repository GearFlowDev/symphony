# The org fork's own fast gate (GEA-9891): three checks, and a worker's PR is not mergeable
# until they answer.
#
# WHY THIS FILE EXISTS. `GearFlowDev/symphony` became a working home on 2026-09-22 — the
# harness bot has write here, so a worker can be sent to fix Symphony's own defects instead of
# a person doing it on a personal repository. A repository workers PR into needs a gate that
# says whether the PR compiles and passes, and it needs one that answers in a minute.
#
# WHY THESE THREE AND NOT `make all`. `make-all.yml` beside this file is upstream's, it came
# with the fork, and it is wider: `mix lint` (credo --strict plus a `@spec` check), `mix test`,
# and `mix dialyzer`. The coverage bar is 90% (GEA-10327, the machine owner's ruling of
# 2026-09-25), but `make all` does not run `mix test --cover` until the fork's own modules
# reach it (GEA-10527). GEA-9891 named the three checks a worker's PR has to pass, and they
# are the three below. `make all` stays where it is; this is the fast gate in front of it, and
# the one that names WHICH of the three broke.
#
# ---- A RED `ci` IS YOURS, NOT `main`'S ----------------------------------------------------
#
# `main` passes all three since GEA-10241. Until then it failed 6 of 340 tests, and nothing
# said so, because Actions had never run on this fork. So a red `ci` on your PR is your diff,
# or a flake to name in an issue; compare against `main`'s latest run before you decide which.
#
# DO NOT MAKE THE TEST STEP NON-BLOCKING to get past a red. A gate that cannot fail is not a
# gate, and this fork's whole problem was that nothing was watching.
#
# ---- The shape ---------------------------------------------------------------------------
#
# Every PR and every push to main. No `concurrency: cancel-in-progress` — cancelling a
# superseded run is how the breaking commit's own job gets killed before it ever reports.
#
# The toolchain comes from `elixir/mise.toml` (Erlang 28, Elixir 1.19.5-otp-28), the same pair
# `devenv.nix` names for a Gearflow slot. They move together or a slot compiles what CI will
# not. Actions are pinned by SHA and not by tag: this job runs `mix deps.get`, so an action
# retargeted under us runs before any code review sees it.
name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: elixir

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: the toolchain elixir/mise.toml names
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install: true
          cache: true
          working_directory: elixir

      - name: cache deps and _build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            elixir/deps
            elixir/_build
          # MIX_ENV is in the key: the compile and the test steps below share one `test`
          # build, and a cache restored from a `dev` build would be a compile nobody checked.
          key: ${{ runner.os }}-mix-test-${{ hashFiles('elixir/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-test-

      - name: dependencies
        run: |
          # `mix local.hex --force` before anything, and not only on a cache miss: a stale
          # archive raises `Enum.__in__/2 is undefined` under Elixir 1.19 and `mix deps.get`
          # then dies before it fetches a single package.
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: mix format --check-formatted
        run: mix format --check-formatted

      # MIX_ENV=test, so this build is the one `mix test` runs on. In `dev` the step would
      # compile a second tree, pass, and leave the test build's warnings unseen.
      - name: mix compile --warnings-as-errors
        env:
          MIX_ENV: test
        run: mix compile --warnings-as-errors

      - name: mix test
        env:
          MIX_ENV: test
        run: mix test
